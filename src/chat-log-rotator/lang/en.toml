# ChatLogRotator's own strings, in English. Copy to lang/<language>.toml to translate; keep the keys.
# The log records themselves ("Chat bob: hello") are not here: their format is fixed.

internal_unavailable = "chat-log-rotator: the internal_msg filter records nothing; internal command results are not exposed to plugins."
write_failed = "chat-log-rotator: could not append to '{0}'."

[command]
desc = "Write chat to log files rotated by day, ISO week or month. Filter, timestamp and rotation are settable at runtime."
period_invalid = "Unknown rotation '{0}'. Use day, week or month."
period_set = "Rotation set to {0}. The next chat line goes to {1}."
filter_invalid = "Unknown filter '{0}'. Use all, messages, chat, private_chat or internal_msg."
filter_set = "Filter set to {0}. The next chat line follows it."
timestamp_set = "Timestamp is now {0}. The next chat line follows it."
status = "Rotation: {0}; filter: {1}; timestamp: {2}; directory: {3}; bucket: {4}; file: {5}"

[settings]
enabled = "Set to false to stop logging without unloading the plugin."
add_datetime = "Prepend a yyyy-MM-dd HH:mm:ss timestamp to every logged line. Change it with /chat-log-rotator timestamp <on|off>."
rotation = "Rotation period: day, week or month. Change it with /chat-log-rotator period <value>."
log_directory = "Log directory. The default ../../chat-log/data keeps the original chat-log folder; use . for this plugin's data folder. Relative paths resolve against this plugin's data folder."
log_file = "File name template. %username%, %serverip% and %period% are expanded; %period% is added automatically when missing."
filter = "all, messages, chat, private_chat or internal_msg. Change it with /chat-log-rotator filter <value>."
